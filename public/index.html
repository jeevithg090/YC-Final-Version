<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Expo adds the meta description and theme colour from app.json (expo.web). -->
    <meta name="color-scheme" content="light" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / social previews. Replace the relative image URL with an
         absolute one (https://your-domain/og-image.png) once deployed. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YOGO Campus" />
    <meta property="og:title" content="YOGO Campus: your campus, simplified" />
    <meta
      property="og:description"
      content="Mess menus, ride sharing, a student marketplace, bill splitting, timetables and more, in one app built for students."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="YOGO Campus logo on a blue and indigo background" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="YOGO Campus: your campus, simplified" />
    <meta
      name="twitter:description"
      content="Mess menus, ride sharing, a student marketplace, bill splitting, timetables and more, in one app built for students."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        margin: 0;
        background-color: #f6f7fb;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Visible keyboard focus for every interactive element (WCAG 2.4.7). */
      :focus-visible {
        outline: 3px solid #8f94fb !important;
        outline-offset: 2px;
      }
      input:focus-visible,
      textarea:focus-visible {
        outline: none !important;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
      /* Shown until the JavaScript bundle has loaded. */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        background: linear-gradient(135deg, #1a1d4e, #4e54c8);
        color: #fff;
        font:
          600 18px system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        z-index: 0;
      }
      #boot img {
        width: 88px;
        height: 88px;
        border-radius: 22px;
      }
      #root:not(:empty) + #boot {
        display: none;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run YOGO Campus.</noscript>
    <div id="root"></div>
    <div id="boot" aria-hidden="true">
      <img src="/apple-touch-icon.png" alt="" />
      <span>YOGO Campus</span>
    </div>
  </body>
</html>
